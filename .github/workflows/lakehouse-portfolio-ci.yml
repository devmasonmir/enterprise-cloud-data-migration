name: Lakehouse Portfolio CI

on:
  push:
    paths:
      - 'projects/enterprise-lakehouse-modernization/**'
      - '.github/workflows/lakehouse-portfolio-ci.yml'
  pull_request:
    paths:
      - 'projects/enterprise-lakehouse-modernization/**'
      - '.github/workflows/lakehouse-portfolio-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: projects/enterprise-lakehouse-modernization
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q lakehouse.py tests databricks
      - run: python -m unittest discover -s tests -v
